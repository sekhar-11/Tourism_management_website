<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking - Southern Safari</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
    
        
        .image-container img {
            
            height: 400px;
            margin-bottom: 15px; 
            border-radius: 10px;
            filter: drop-shadow(0 0px 6px rgba(75, 231, 236, 0.6));
        }
        .flight{
            position: absolute;
            height: 200px !important;
            width: 430px !important;
            top: 260px;
            left: 150px;
        }
        .bus{
            position: absolute;
            width: 600px;
            top: 260px;
            left: 280px;
            
        }
        .train{
            position: absolute;
            width: 400px;
            height: -200px;
            left: 80px;
            top: 290px;
            

        }
        .booking-container {
            position: relative;
            right: -300px;
            background-color: rgba(31, 31, 31, 0.9); 
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 400px;
            filter: drop-shadow(0 0px 6px rgba(245, 242, 243, 0.6));
        }
        h2 {
            text-align: center;
            color: #fff;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #bbb;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            background-color: #333;
            color: #fff;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #f11c5c;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e61957e5;
        }
        .result, .booking-message {
            margin-top: 20px;
            font-size: 18px;
            color: #fff;
            text-align: center;
        }
        nav {
            position: fixed;
            width: 100%;
            top: 0px;
            height: 30px;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.705) ;
            z-index: 3;
            backdrop-filter: blur(10px);
          }
          ul {
            float: left;
            display: flex;
            justify-content: center;
            align-items: center;
          }
          ul li {
            list-style: none;
            margin-left: 200px;
            margin-top: -10px;
            font-size: 16px;
          }
          
          ul li a {
            text-decoration: none;
            color: aliceblue;
            font-family: Arial;
            font-size: large;
            font-weight: bold;
            transition: 0.4s ease-in-out;
          }
          ul li a:hover {
            color: #f5168d;
          }
    </style>
    <link rel="stylesheet" href="../../assets/css/booking-flow.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="../kerala/index.html">BACK</a></li>
        </ul>
      </nav>
<div class="container">
    <div class="image-container">
        <img class="flight" src="../../assets/images/shared/transport/flight.png" alt="Travel Image 1">
        <img class="bus" src="../../assets/images/shared/transport/bus.png" alt="Travel Image 2">
        <img class="train" src="../../assets/images/shared/transport/train.png" alt="Travel Image 3">
    </div>

    <div class="booking-container">
        <h2>Book Your Travel</h2>

        <input id="destination" type="text">
        
        <label for="transport">Select Transport Medium:</label>
        <select id="transport">
            <option value="bus" data-cost="500">Bus - ₹500/person</option>
            <option value="train" data-cost="300">Train - ₹300/person</option>
            <option value="flight" data-cost="2000">Flight - ₹2000/person</option>
        </select>

        <label for="persons">Number of Persons:</label>
        <input type="number" id="persons" min="1" value="1">

        <button onclick="calculateCost()">Calculate Cost</button>

        <div class="result" id="result"></div>

        <button onclick="bookNow()">Book Now</button>

        <div class="booking-message" id="bookingMessage"></div>
    </div>
</div>

<script>
    function calculateCost() {
        var transportElement = document.getElementById('transport');
        var transportCost = parseInt(transportElement.options[transportElement.selectedIndex].getAttribute('data-cost'));
        var persons = parseInt(document.getElementById('persons').value);
        var totalCost = transportCost * persons;
        
        document.getElementById('result').innerHTML = "Total Cost: ₹" + totalCost;
    }

</script>

<script src="../../assets/js/booking-flow.js"></script>
</body>
</html>
